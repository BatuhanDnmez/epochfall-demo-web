server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Godot's engine is a large WebAssembly file: serve it with the right type, compressed.
    types {
        application/wasm wasm;
    }
    gzip on;
    gzip_types application/wasm application/javascript application/octet-stream text/html text/css;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # The game files change with every build; the page itself must never be stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(wasm|pck|js|png)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
